version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://ioe_user:ioe_secure_password@postgres:5432/ioe_master?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - ATTEMPT_SIGNING_SECRET=ioe-production-signing-secret-2026
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ioe_postgres
    environment:
      POSTGRES_DB: ioe_master
      POSTGRES_USER: ioe_user
      POSTGRES_PASSWORD: ioe_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ioe_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
